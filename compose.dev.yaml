name: mindway-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env.dev}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env.dev}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.dev}"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: dev
    env_file:
      - .env.dev
    environment:
      APP_ENV: dev
      NODE_ENV: development
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.dev}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.dev}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.dev}@redis:6379"
      CHOKIDAR_USEPOLLING: "true"
    command: ["sh", "-c", "npm run db:generate && npm run dev"]
    ports:
      - "${PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - api_dev_node_modules:/app/node_modules

volumes:
  postgres_dev_data:
    name: api_postgres_dev_data
  redis_dev_data:
    name: api_redis_data
  api_dev_node_modules:
